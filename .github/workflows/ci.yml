name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      # Report every Node version even when one fails: with the default
      # fail-fast, a failure on 22 cancels the 20 job mid-flight and the run
      # stops telling you whether 20 passed.
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Syntax check
        run: |
          node --check index.js
          node --check client.js

      - name: Manifest sanity
        run: node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client) { throw new Error('dsh manifest incomplete') }; console.log(p.name, p.version)"

      - name: Host-half tests
        # No path argument on purpose. Node 22 resolves a positional argument as
        # a module path, so `node --test test/` dies with MODULE_NOT_FOUND;
        # Node 20 and 26 expand it as a directory. Without arguments the runner
        # discovers `test/**` on every version in the matrix.
        #
        # DSH_ANNOTATE_HOST_ROOT=absent is the ONE explicit opt-out for the host
        # shape fence (test/host-shape.test.mjs). A GitHub runner has no DSH
        # installation, so the fence cannot be verified here; the variable says
        # so out loud and the suite prints
        #   host shape check: skipped by DSH_ANNOTATE_HOST_ROOT=absent
        # into this log. Without the variable a missing host root is a FAILURE,
        # never a silent pass — the fence must not disappear because the host
        # moved. Release evidence therefore includes a local strict run with the
        # host present (22/22 assertions, exit 0).
        env:
          DSH_ANNOTATE_HOST_ROOT: absent
        run: |
          set -o pipefail
          node --test 2>&1 | tee test-output.txt
          status=$?
          if [ "$status" -ne 0 ]; then
            # A job log needs repository admin rights to read over the API, but
            # check-run annotations do not. Publish the tail of the failure as a
            # single annotation (newlines escaped) so a failure on this
            # repository can actually be diagnosed from outside.
            tail -n 80 test-output.txt | sed ':a;N;$!ba;s/\n/%0A/g' | sed 's/^/::error::Host-half tests failed:%0A/'
          fi
          exit "$status"

      - name: Host shape fence must be visible
        # The opt-out above is only acceptable if its trace is readable: this
        # step fails unless the skip line is in the log of the run that produced
        # it, so "green and quiet" cannot be confused with "verified".
        run: |
          if ! grep -F 'host shape check: skipped by DSH_ANNOTATE_HOST_ROOT=absent' test-output.txt; then
            echo "::error::the host shape fence produced no skip line and no verification line"
            exit 1
          fi
